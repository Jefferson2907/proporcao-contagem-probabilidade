<title>Proporção, Contagem e Probabilidade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap">
<style>
/* Layout: lousa escura de apresentação — palco animado à esquerda, narração passo a passo à direita, navegação embaixo (em telas estreitas: palco em cima, texto embaixo) */
:root{
  --bg:#0e1015; --panel:#13161e; --raise:#1a1e29; --line:#262b38;
  --fg:#e9ebf1; --mute:#a3aaba; --faint:#6b7285;
  --yellow:#ffd54a; --blue:#58c4dd; --pink:#ff8fb1; --green:#83c167; --red:#fc6255;
  --serif:"STIX Two Text","Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:18px;padding-block:12px;min-width:0}
.brand{font-family:var(--serif);font-size:22px;font-style:italic;font-weight:500;white-space:nowrap;letter-spacing:-.01em}
.brand b{font-style:normal;color:var(--yellow);font-weight:600}
.part{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
select{flex:0 1 auto;min-width:0;max-width:60%;font:inherit;font-size:14px;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%;min-width:0}
.prog{height:2px;background:var(--line);position:relative;border-radius:2px}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--yellow);transition:width .4s ease;border-radius:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0;gap:0;padding-block:12px}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--yellow)}
.panel{min-height:0;overflow-y:auto;padding:6px 4px 24px 28px;display:flex;flex-direction:column;gap:18px}
.kicker{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.panel h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,2.4vw,34px);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
.steps{display:flex;flex-direction:column;gap:14px}
.steps .st{margin:0;color:var(--faint);transition:color .4s ease;max-width:62ch}
.steps .st.now{color:var(--fg);padding-left:14px;border-left:2px solid var(--yellow);margin-left:-16px}
.steps .st b{color:inherit;font-weight:600}
.steps .st.now b{color:#fff}
.try{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--yellow);padding:2px 7px;border-radius:4px;margin-right:6px;vertical-align:2px}
.st:not(.now) .try{background:var(--faint)}
.note{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--mute);display:block;margin-top:10px}
.note .tag{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:4px}
.ctrls{display:flex;flex-direction:column;gap:14px}
.ctrls[hidden]{display:none}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;font-size:14px;color:var(--mute)}
.sl output{font-family:var(--mono);color:var(--fg);font-size:14px}
.sl input{grid-column:1 / -1;width:100%;accent-color:var(--yellow)}
.info{display:flex;flex-direction:column;gap:12px}
.info:empty{display:none}
.ro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0;padding:14px 0 0;border-top:1px solid var(--line)}
.ro dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.ro dd{margin:0;font-family:var(--mono);font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.eq{font-family:var(--serif);font-size:22px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding-top:12px;border-top:1px solid var(--line);overflow-x:auto}
.eq .big{font-size:30px}
.chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;padding:5px 10px;border-radius:999px;border:1px solid currentColor;width:max-content;max-width:100%}
.chip.ok{color:var(--green)} .chip.no{color:var(--red)}
/* notação vetorial no texto */
.vec{font-family:var(--serif);font-style:italic;font-weight:600;position:relative;display:inline-block;padding:0 .05em;line-height:1;font-size:1.08em}
.vec::before{content:"";position:absolute;left:10%;right:8%;top:-.3em;height:1.5px;background:currentColor}
.vec::after{content:"";position:absolute;right:6%;top:-.3em;width:.27em;height:.27em;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:translate(1px,-48%) rotate(45deg)}
.c-y{color:var(--yellow)} .c-b{color:var(--blue)} .c-p{color:var(--pink)} .c-g{color:var(--green)} .c-r{color:var(--red)} .c-w{color:var(--fg)}
.cv{display:inline-grid;position:relative;padding:0 .5em;vertical-align:middle;text-align:center;line-height:1.2;font-family:var(--serif);font-style:normal;margin:0 .1em}
.cv::before,.cv::after{content:"";position:absolute;top:.05em;bottom:.05em;width:.28em;border:1.5px solid currentColor}
.cv::before{left:0;border-right:none} .cv::after{right:0;border-left:none}
.m{font-family:var(--serif);font-size:1.08em}
/* quiz */
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qi{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--raise)}
.qi .nm{font-weight:600;font-size:14.5px}
.qi .row{display:flex;gap:6px}
.qi.ok{border-color:var(--green)} .qi.no{border-color:var(--red)}
.qi .fb{font-size:13px;color:var(--mute);margin:0}
/* exercícios */
.kicker.ex{color:var(--green)}
.exw{display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:16px}
.exnav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.exnav div{display:flex;gap:6px;flex-wrap:wrap}
.rd{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mute);font-family:var(--mono);font-size:12px}
.rd.on{border-color:var(--yellow);color:var(--yellow)}
.rd.ok{background:var(--green);border-color:var(--green);color:#10140c}
.rd.sh{border-style:dashed}
.exq{margin:0;font-size:16.5px;color:var(--fg)}
.exhint{margin:0;font-size:13px;color:var(--faint)}
.exin{display:flex;flex-direction:column;gap:8px}
.exin label{display:grid;grid-template-columns:5.5em minmax(0,9em) auto;gap:10px;align-items:center;font-family:var(--serif);font-size:18px}
.exin input{font-family:var(--mono);font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.exin input[readonly]{border-color:var(--green)}
.exin em{font-style:normal;font-family:var(--mono);font-size:13px;color:var(--mute)}
.excl{display:flex;flex-direction:column;gap:8px}
.excl .row{flex-wrap:wrap}
.excl .mini{flex:1 1 auto}
.exact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.exfb{margin:0;font-size:15px;padding:10px 12px;border-radius:8px;border-left:3px solid currentColor;background:var(--bg)}
.exfb.ok{color:var(--green)} .exfb.no{color:var(--red)}
.exfb b{color:var(--fg)}
.dirs{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:start}
.dirs .mini{flex:none;padding:7px 0;font-family:var(--mono)}
.dirs .dc{display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;color:var(--faint)}
.exmsg{margin:0;font-size:15px;color:var(--mute)} .exmsg b{color:var(--yellow);font-weight:500}
/* múltipla escolha, explicação, relatório */
.kicker.wk{color:var(--blue)}
.exch{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;line-height:1.45}
.opt b{font-family:var(--mono);color:var(--mute);font-weight:500}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt.right{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.opt.wrong{border-color:var(--red);color:var(--mute);text-decoration:line-through;text-decoration-color:var(--red)}
.opt:disabled{cursor:default}
.exta{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mute)}
.exta textarea,.exta input{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;resize:vertical}
.exta textarea[readonly]{color:var(--mute)}
.model{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.model .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
.model p{margin:0;color:var(--fg);font-size:15px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;color:var(--mute)}
.ck input{margin-top:4px;accent-color:var(--green)}
.sg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--mute)}
.sg .mini{flex:0 1 auto}
.btn.danger{border-color:var(--red);color:var(--red)}
/* tabela resumo */
table.sum{border-collapse:collapse;width:100%;font-size:14.5px;margin-top:4px}
.sum th,.sum td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sum th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500}
.sum td:first-child{color:var(--yellow);white-space:nowrap;font-weight:500}
ol.disc{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
/* botões */
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font-size:14.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#14130c;font-weight:600}
.btn.primary:hover{background:#ffe07a}
.btn:disabled{opacity:.35;cursor:default}
.mini{padding:5px 10px;font-size:13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);flex:1}
.mini:hover{color:var(--fg);border-color:var(--faint)}
.mini.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
footer{display:flex;align-items:center;gap:14px;padding-block:10px 14px;border-top:1px solid var(--line)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--faint)} .dots i.now{background:var(--yellow)}
.count{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
.keys{font-family:var(--mono);font-size:11px;color:var(--faint)}
@media (max-width:900px){
  .app{height:auto;min-height:100%}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{aspect-ratio:4 / 3;max-height:62vh;width:100%}
  .panel{padding:22px 0 12px;overflow:visible}
  .steps .st.now{margin-left:0}
  footer{position:sticky;bottom:0;background:var(--bg);padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
  .keys,.part{display:none}
  .count{display:none}
}
@media (max-width:600px){ .dots{visibility:hidden} .lbl{display:none} footer{gap:8px} }
@media (max-width:420px){ .quiz{grid-template-columns:minmax(0,1fr)} .btn{padding:9px 13px} }
.st ul.goals{margin:8px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.opt.pick{border-color:var(--yellow);box-shadow:inset 0 0 0 1px var(--yellow)}
.opt:disabled:not(.pick):not(.right){opacity:.55}
table.lab td,table.lab th{font-family:var(--mono);font-size:13px;padding:4px 6px}
table.lab td:first-child{color:var(--fg)}
.qtab{border-collapse:collapse;margin:8px 0 2px;font-size:14px}.qtab th,.qtab td{border-bottom:1px solid var(--line);padding:4px 10px;text-align:left}.qtab th{color:var(--mute);font-weight:600}
.exin label span sub{font-size:70%}
.exnav .lv{color:var(--yellow);letter-spacing:.1em;margin-left:6px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.92em;margin:0 .12em;font-variant-numeric:tabular-nums}
.fr i{font-style:normal;padding:0 .18em}
.fr i:first-child{border-bottom:1.5px solid currentColor}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.labgrid label{display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.labgrid input{width:100%;font:inherit;font-size:15px;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
@media (max-width:1100px){.brand{font-size:19px}}
@media (max-width:600px){.brand{font-size:15px;white-space:normal;line-height:1.15;max-width:52%}}
</style>

<div class="app">
  <div class="bar">
    <span class="brand">Proporção, Contagem <b>e</b> Probabilidade</span>
    <span class="part" id="part"></span>
    <label for="sel" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Ir para a cena</label>
    <select id="sel"></select>
  </div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
  <main>
    <div class="stage"><canvas id="cv" tabindex="0" aria-label="Animação da cena atual"></canvas></div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <footer>
    <button class="btn" id="prev" type="button">← Voltar</button>
    <button class="btn" id="again" type="button" title="Repetir a animação deste passo" aria-label="Repetir a animação deste passo">↻<span class="lbl"> Repetir</span></button>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <span class="count" id="count"></span>
    <span class="keys">teclas ← →</span>
    <button class="btn primary" id="next" type="button">Próximo →</button>
  </footer>
</div>

<script>
/* ================== base ================== */
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SERIF='"STIX Two Text","Times New Roman",serif', MONO='"JetBrains Mono",ui-monospace,monospace', SANS='"IBM Plex Sans",system-ui,sans-serif';
const K={y:'#ffd54a',b:'#58c4dd',p:'#ff8fb1',g:'#83c167',r:'#fc6255',w:'#e9ebf1',m:'#a3aaba',f:'#6b7285',bg:'#0e1015'};
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]], sub=(p,q)=>[p[0]-q[0],p[1]-q[1]], mul=(p,k)=>[p[0]*k,p[1]*k];
const hyp=p=>Math.hypot(p[0],p[1]), lerp=(a,b,t)=>a+(b-a)*t, lerp2=(p,q,t)=>[lerp(p[0],q[0],t),lerp(p[1],q[1],t)];
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI, pol=(r,a)=>[r*Math.cos(rad(a)),r*Math.sin(rad(a))];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function fmt(n,d=2){if(Math.abs(n)<1e-9)n=0;let s=n.toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',').replace('-','−');}
const par=n=>n<0?`(${fmt(n)})`:fmt(n);
function compass(a){const n=['leste','nordeste','norte','noroeste','oeste','sudoeste','sul','sudeste'];return n[Math.round((((a%360)+360)%360)/45)%8];}
const angOf=p=>deg(Math.atan2(p[1],p[0]));
const E={io:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, lin:t=>t};

/* texto do painel: {v:y} = vetor colorido, [[3,2]] = vetor coluna */
const VC={y:'c-y',b:'c-b',p:'c-p',g:'c-g',r:'c-r',w:'c-w'};
const cvH=(arr,c='')=>`<span class="cv ${c}">${arr.map(x=>`<span>${x}</span>`).join('')}</span>`;
function M(s){return s.replace(/\{([^:{}]+):([a-z])\}/g,(m,t,c)=>`<span class="vec ${VC[c]}">${t}</span>`).replace(/\[\[([^\]]+)\]\]/g,(m,t)=>cvH(t.split(t.includes('|')?'|':',').map(x=>x.trim())));}
const vh=(t,c)=>`<span class="vec ${VC[c]}">${t}</span>`;
const ro=pairs=>`<dl class="ro">${pairs.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;

/* ================== animação ================== */
let FAST=false, dirty=true;
let tweens=[];
function lerpAny(a,b,t){return Array.isArray(a)?a.map((x,i)=>x+(b[i]-x)*t):a+(b-a)*t;}
function to(obj,props,dur=800,ez=E.io){
  return new Promise(res=>{
    if(FAST||RM||dur<=0){for(const k in props)obj[k]=Array.isArray(props[k])?props[k].slice():props[k];dirty=true;res();return;}
    const keys=Object.keys(props);
    tweens=tweens.filter(T=>!(T.obj===obj&&T.keys.some(k=>keys.includes(k))));
    tweens.push({obj,keys,from:keys.map(k=>Array.isArray(obj[k])?obj[k].slice():obj[k]),to:keys.map(k=>props[k]),t0:performance.now(),dur,ez,res});
  });
}
const sleep=ms=>(FAST||RM)?Promise.resolve():new Promise(r=>setTimeout(r,ms));
function stepTweens(now){
  if(!tweens.length)return;
  const done=[];
  for(const T of tweens){const p=Math.min(1,(now-T.t0)/T.dur),e=T.ez(p);T.keys.forEach((k,i)=>T.obj[k]=lerpAny(T.from[i],T.to[i],e));if(p>=1)done.push(T);}
  if(done.length){tweens=tweens.filter(T=>!done.includes(T));done.forEach(T=>T.res());}
  dirty=true;
}
function flushTweens(){const ts=tweens;tweens=[];ts.forEach(T=>{T.keys.forEach((k,i)=>T.obj[k]=Array.isArray(T.to[i])?T.to[i].slice():T.to[i]);T.res();});dirty=true;}

/* ================== palco ================== */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=800,H=600,DPR=1;
const cam={x0:-6,x1:6,y0:-4,y1:4};
let s=40,ox=0,oy=0;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(10,r.width);H=Math.max(10,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);dirty=true;}
new ResizeObserver(resize).observe(cv);
let FS=1;function setCam(){FS=clamp(W/640,.68,1);const m=28;s=Math.min((W-2*m)/(cam.x1-cam.x0),(H-2*m)/(cam.y1-cam.y0));ox=W/2-s*(cam.x0+cam.x1)/2;oy=H/2+s*(cam.y0+cam.y1)/2;}
const X=x=>ox+s*x, Y=y=>oy-s*y, S=p=>[X(p[0]),Y(p[1])], Wd=(px,py)=>[(px-ox)/s,(oy-py)/s];
function camTo(v,dur){return to(cam,{x0:v[0],x1:v[1],y0:v[2],y1:v[3]},dur);}

function grid(a=1){
  if(a<=0.01)return;
  ctx.save();ctx.globalAlpha=a;

  steps:['Pintar o muro dá uma quantidade fixa de trabalho. 3 pintores em 12 dias fazem 3 · 12 = <b>36 “pintor-dias”</b>. Cada quadradinho é o trabalho de um pintor em um dia: 3 colunas (pintores) e 12 linhas (dias).',

  reset:()=>({n:0,w:3,h:0,drag:false}),
  run:[async st=>{await to(st,{n:36},2200,E.lin);},async st=>{st.n=36;await to(st,{w:6},1600);},async st=>{st.n=36;st.w=6;await to(st,{h:1},1000);},async st=>{st.n=36;st.w=6;st.h=1;st.drag=true;}],

    for(let i=3;i<=12;i+=3){txtW(String(i),[i*RU,0],{dy:13,col:K.m,font:`11px ${MONO}`});txtW(String(i),[0,i*RU],{dx:-7,align:'right',col:K.m,font:`11px ${MONO}`});}
    if(st.n<36-1e-6){for(let q=0;q<Math.floor(st.n);q++){const c=Math.floor(q/12),r=q%12;rrW(c*RU+.03,r*RU+.03,(c+1)*RU-.03,(r+1)*RU-.03,{r:2,fill:K.y,a:.85});}}
    else{rectW(0,0,w*RU,h*RU,K.y,.75);for(let i=1;i<w-1e-6;i++)lineW([i*RU,0],[i*RU,h*RU],K.bg,{w:1.5});for(let j=1;j<h-1e-6;j++)lineW([0,j*RU],[w*RU,j*RU],K.bg,{w:1.5});
      polyW([[0,0],[w*RU,0],[w*RU,h*RU],[0,h*RU]],{col:K.y,w:2,close:true});txtW(`${fmt(w,1)} · ${fmt(h,1)} = 36`,[w*RU/2,h*RU/2],{col:K.bg,font:`700 14px ${MONO}`});}

  txtW(title,[cx,-1.3],{dy:18,col,font:`600 13px ${SANS}`,a});}

  if(it.ch)txtW(it.ch,[x+SLOTW/2,y+.55],{col:K.w,font:`600 20px ${MONO}`,a});if(it.n!=null)txtW(String(it.n),[x+SLOTW/2,y],{dy:16,col:it.c||K.y,font:`600 14px ${MONO}`,a});
  if(i<n-1&&it.n!=null)txtW('·',[x+SLOTW+SLOTG/2,y],{dy:16,col:K.m,font:`600 14px ${MONO}`,a});if(o.cap&&o.cap[i])txtW(o.cap[i],[x+SLOTW/2,y+1.1],{dy:-11,col:K.m,font:`11px ${MONO}`,a});});return x0;}

function bag(cx,cy,w,h,a=1){rrW(cx-w/2,cy-h/2,cx+w/2,cy+h/2,{r:28,fill:'rgba(26,30,41,.85)',col:K.m,w:2,a});lineW([cx-w*.28,cy+h/2],[cx-w*.18,cy+h/2+.35],K.m,{w:2,a});lineW([cx+w*.28,cy+h/2],[cx+w*.18,cy+h/2+.35],K.m,{w:2,a});}
function bagBalls(cx,cy,cols,o={}){const n=cols.length,per=Math.ceil(Math.sqrt(n*1.4)),r=o.r||.32;cols.forEach((c,i)=>{const row=Math.floor(i/per),col=i%per,nr=Math.ceil(n/per);const x=cx+(col-(Math.min(per,n-row*per)-1)/2)*r*2.4,y=cy+((nr-1)/2-row)*r*2.4;
  ballW([x,y],r,c,{a:o.a,edge:o.hl&&o.hl(i)?K.w:K.bg,label:o.lab?String(i+1):'',fs:10});});}
function pbarW(x0,x1,y,p,col,a=1){rrW(x0,y-.2,x1,y+.2,{r:6,fill:'rgba(255,255,255,.06)',a});if(p>0)rrW(x0,y-.2,x0+(x1-x0)*p,y+.2,{r:6,fill:col,a});}
const URNA={title:'Contar os casos: o espaço amostral',view:[-7,7,-3.8,4.2],
  steps:['Os resultados possíveis de um sorteio formam o <b>espaço amostral</b>. Na caixa com 3 bolas azuis e 1 vermelha, cada <b>bola</b> é um resultado (numere-as de 1 a 4): são 4 resultados, todos com a mesma chance.',
    {t:()=>'O <b>evento</b> “sair vermelha” tem 1 caso favorável em 4 possíveis: P = '+F(1,4)+' = <b>25%</b>. “Sair azul”: '+F(3,4)+' = 75%. O raciocínio “ou acontece ou não, então é 50%” falha porque os dois lados não têm o mesmo número de casos.'+retake('p7','A chance é 1/4 = 25%. Cuidado também com “1 para 3”: essa é a razão vermelha : azul, e não a probabilidade, que divide pelo total de bolas (4).')},
    'Repare: P(azul) + P(vermelha) = '+F(3,4)+' + '+F(1,4)+' = 1. Algum dos dois sempre acontece. A chance de um evento <b>não</b> acontecer é o seu <b>complementar</b>: P(não A) = 1 − P(A).',
    {try:1,t:'Mude a quantidade de bolas de cada cor e veja as probabilidades. Elas sempre somam 1 (100%).'}],
  ctrlFrom:3,reset:()=>({k:0,az:3,vm:1}),run:[null,async st=>{st.k=1;},async st=>{st.k=2;},async st=>{st.k=3;}],
  draw(st){const az=st.az,vm=st.vm,n=az+vm;bag(-3.6,.4,5,5.2);bagBalls(-3.6,.2,[...Array(az).fill(K.b),...Array(vm).fill(K.r)],{lab:n<=12,r:n>9?.3:.4,hl:i=>st.k===1&&i>=az});
    if(!n){txtW('caixa vazia',[-3.6,.4],{col:K.m,font:`13px ${MONO}`});return;}
    txtW(`espaço amostral: ${n} bolas`,[-3.6,-2.6],{dy:8,col:K.m,font:`13px ${MONO}`});
    if(st.k>=1){fracW(vm,n,[1.4,2.4],{col:K.r,size:18});txtW(`P(vermelha) = ${FR(vm/n)}`,[2.1,2.4],{align:'left',col:K.r,font:`600 15px ${MONO}`});pbarW(1,6.4,1.2,vm/n,K.r);
      fracW(az,n,[1.4,-.1],{col:K.b,size:18});txtW(`P(azul) = ${FR(az/n)}`,[2.1,-.1],{align:'left',col:K.b,font:`600 15px ${MONO}`});pbarW(1,6.4,-1.3,az/n,K.b);}
    if(st.k>=2)txtW(`${az}/${n} + ${vm}/${n} = 1`,[3.7,-2.6],{col:K.g,font:`600 16px ${MONO}`});},
  ctrls(el){slider(el,{key:'az',label:'Bolas azuis',min:0,max:10,step:1,get:()=>ST().az,set:v=>{ST().az=v;},fmt:v=>fmt(v,0)});slider(el,{key:'vm',label:'Bolas vermelhas',min:0,max:10,step:1,get:()=>ST().vm,set:v=>{ST().vm=v;},fmt:v=>fmt(v,0)});},
  info:st=>{const n=st.az+st.vm;return st.k===3&&n?ro([['P(vermelha)',`${st.vm}/${n} ≈ ${FR(st.vm/n)}`],['P(azul)',`${st.az}/${n} ≈ ${FR(st.az/n)}`]]):'';}};

const RCOL=[K.y,K.b,K.p],RSEC=[[0,180],[180,270],[270,360]];
function wheel(c,R,ang,o={}){RSEC.forEach(([a0,a1],i)=>{const [x,y]=S(c);ctx.save();ctx.fillStyle=RCOL[i];ctx.globalAlpha=.85;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,R*s,-rad(a0+ang),-rad(a1+ang),true);ctx.closePath();ctx.fill();ctx.restore();});
  arcW(c,R,0,360,K.w,{w:2});if(o.q)[0,90,180,270].forEach(t=>lineW(c,add(c,pol(R,t+ang)),K.bg,{w:2.5,dash:[6,4]}));
  const tip=add(c,[0,R+.05]);polyW([add(tip,[-.22,.45]),tip,add(tip,[.22,.45])],{fill:K.w,close:true});dotW(c,5,K.bg);}
function wheelHit(ang){const t=((90-ang)%360+360)%360;return RSEC.findIndex(([a,b])=>t>=a&&t<b);}
const ROLETA={title:'Cuidado: os casos têm a mesma chance?',view:[-7,7,-3.8,4.2],

    {try:1,t:'Gire a roleta muitas vezes e acompanhe as porcentagens de cada cor. Com muitos giros, o amarelo fica perto de 50%, e não de 33%.'}],

  draw(st){wheel([-3,.2],2.8,st.ang,{q:st.q>.5});if(st.last>=0)txtW(['amarelo','azul','rosa'][st.last],[-3,-2.6],{dy:-6,col:RCOL[st.last],font:`600 15px ${SANS}`});
    if(st.q>.5){txtW('amarelo: 2 de 4 partes = 1/2',[1.2,2.8],{align:'left',col:K.y,font:`600 14px ${MONO}`});txtW('azul: 1/4     rosa: 1/4',[1.2,2.1],{align:'left',col:K.m,font:`600 14px ${MONO}`});}
    const n=st.cnt.reduce((a,b)=>a+b,0);if(n){lineW([1.2,-2.4],[6.4,-2.4],K.m);st.cnt.forEach((c,i)=>{const x=1.8+i*1.7,h=3*c/n;rectW(x-.5,-2.4,x+.5,-2.4+h,RCOL[i],.9);txtW(FR(c/n,0),[x,-2.4+h],{dy:-11,col:K.w,font:`12px ${MONO}`});});
      lineW([1.2,-2.4+1.5],[6.4,-2.4+1.5],K.w,{dash:[4,5],a:.6});txtW('50%',[6.4,-.9],{dx:4,align:'left',col:K.m,font:`11px ${MONO}`});txtW(`${n} giros`,[3.8,-2.4],{dy:16,col:K.m,font:`12px ${MONO}`});}},
  ctrls(el){const box=document.createElement('div');box.className='exact';el.appendChild(box);
    const mk=(t,f)=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=t;b.onclick=f;box.appendChild(b);};
    mk('Girar ▶',()=>{const st=ST();const fin=st.ang+720+Math.random()*360;st.last=-1;to(st,{ang:fin},RM?0:1600).then(()=>{st.ang=st.ang%360;const h=wheelHit(st.ang);st.cnt[h]++;st.last=h;dirty=true;});});
    mk('Girar 100 vezes',()=>{const st=ST();for(let i=0;i<100;i++){const a=Math.random()*360;st.cnt[wheelHit(a)]++;if(i===99){st.ang=a;st.last=wheelHit(a);}}dirty=true;});
    mk('Zerar',()=>{const st=ST();st.cnt=[0,0,0];st.last=-1;dirty=true;});},
  info:st=>{const n=st.cnt.reduce((a,b)=>a+b,0);return n?ro([['Giros',n],['Amarelo',FR(st.cnt[0]/n)],['Azul',FR(st.cnt[1]/n)],['Rosa',FR(st.cnt[2]/n)]]):'';}};

const WE_BALAS=WK({title:'Exemplo resolvido: as balas da sacola',view:[-7,7,-3.6,4.2],
  base(st){bag(-3.8,.3,5,5);bagBalls(-3.8,.3,BALAS,{r:.42,hl:i=>st.k>=2&&i>=5});},
  steps:[{t:'<b>Problema.</b> Numa sacola há 5 balas de morango (rosa), 3 de uva (roxas) e 2 de limão (verdes), todas do mesmo formato. Pegando uma sem olhar, qual é a probabilidade de <b>não</b> ser de morango?'},
    {t:'<b>Passo 1 · compreender.</b> Cada bala tem a mesma chance de ser pega. O espaço amostral são as <b>10 balas</b>.',draw:a=>txtW('10 casos possíveis',[2.6,2.8],{col:K.w,font:`600 15px ${MONO}`,a})},
    {t:'<b>Passo 2 · planejar.</b> “Não ser de morango” é ser de uva <b>ou</b> de limão: 3 + 2 = <b>5</b> casos favoráveis (destacados).',draw:a=>txtW('favoráveis: 3 + 2 = 5',[2.6,1.6],{col:K.w,font:`600 15px ${MONO}`,a})},
    {t:'<b>Passo 3 · executar.</b> P(não morango) = '+F(5,10)+' = '+F(1,2)+' = <b>50%</b>.',draw:a=>{fracW(5,10,[1.6,-.2],{col:K.g,size:18,a});txtW('= 1/2 = 50%',[2.3,-.2],{align:'left',col:K.g,font:`600 17px ${MONO}`,a});}},
    {t:'<b>Confira</b> pelo complementar: P(morango) = '+F(5,10)+', e 1 − '+F(1,2)+' = '+F(1,2)+' ✓. O resultado está entre 0 e 1 ✓.',draw:a=>txtW('1 − P(morango) = 1 − 5/10 = 1/2  ✓',[2.6,-2.2],{col:K.m,font:`600 14px ${MONO}`,a})}]});

EX.E7=exScene({title:'Pratique: probabilidade',view:[-6,6,-4,4],
  intro:'P = casos favoráveis ÷ casos possíveis, se todos os casos têm a mesma chance. P fica entre 0 e 1. P(não A) = 1 − P(A).',
  rounds:[
    {type:'inputs',grid:0,frac:true,q:'<b>Complete.</b> Um dado comum é lançado. Casos possíveis: __. Casos favoráveis a “sair um número maior que 4”: __. Probabilidade: __.',
      fields:[{k:'p',label:'possíveis =',name:'os casos possíveis',ans:6},{k:'f',label:'favoráveis =',name:'os favoráveis',ans:2},PF('P','P =','a probabilidade',1,3)],
      ok:'Possíveis: 1, 2, 3, 4, 5, 6. Maiores que 4: 5 e 6. P = 2/6 = 1/3 ≈ 33%.',hint:'“Maior que 4” não inclui o 4.',
      draw(rs){for(let k=1;k<=6;k++)dieW([-4.4+(k-1)*1.75,0],1.1,k,{fill:done(rs)&&k>4?K.p:'#eef1f6'});}},
    {type:'classify',grid:0,q:'Classifique cada acontecimento.',opts:['Impossível','Possível, mas não certo','Certo'],ok:'Isso. Impossível tem P = 0; certo tem P = 1; o resto fica entre os dois.',
      items:[{t:'Sair 0 num dado comum',a:0,why:'O dado vai de 1 a 6.'},{t:'Sair um número par num dado',a:1,why:'P = 3/6 = 1/2.'},{t:'Sair um número de 1 a 6 num dado',a:2,why:'Todos os resultados são favoráveis.'},
        {t:'Tirar uma bola verde de uma caixa só com bolas azuis',a:0,why:'Não há bola verde.'},{t:'Um mês sorteado ao acaso ter menos de 32 dias',a:2,why:'Todos os meses têm de 28 a 31 dias.'},{t:'Sair cara numa moeda',a:1,why:'P = 1/2.'}]},
    {type:'inputs',grid:0,frac:true,q:'Numa caixa há 4 bolas brancas, 6 pretas e 2 verdes. Tirando uma ao acaso, qual é a probabilidade de ser preta?',fields:[PF('p','P(preta) =','a probabilidade',1,2)],
      ok:'Total: 4 + 6 + 2 = 12 bolas. Pretas: 6. P = 6/12 = 1/2 = 50%.',hint:'Divida pelo total de bolas, e não pelo número de cores.',
      draw(){bag(0,0,5,4.6);bagBalls(0,-.1,[...Array(4).fill('#e9ebf1'),...Array(6).fill('#2a2d36'),...Array(2).fill(K.g)],{r:.38});}},
    {type:'inputs',grid:0,frac:true,q:'As 26 letras do alfabeto foram escritas em papeizinhos iguais e colocadas numa urna. Qual é a probabilidade de sortear uma vogal?',fields:[PF('p','P(vogal) =','a probabilidade',5,26)],
      ok:'Vogais: A, E, I, O, U, 5 casos favoráveis em 26 possíveis. P = 5/26 ≈ 19%.',hint:'Quantas vogais há no alfabeto?'},
    {type:'drag',start:[-3,0],ans:[1,0],snap:1,q:'Arraste o marcador até a probabilidade de sair um número <b>maior que 2</b> no lançamento de um dado.',
      constrain:p=>[clamp(p[0],-3,3),0],ok:'Maiores que 2: 3, 4, 5 e 6. P = 4/6 = 2/3 ≈ 67%.',hint:p=>`Seu marcador está em ${fmt(p[0]+3,0)}/6. Conte quantas faces são maiores que 2.`,
      draw(rs){lineW([-3,0],[3,0],K.m,{w:3});for(let k=0;k<=6;k++){lineW([-3+k,-.2],[-3+k,.2],K.w,{w:2});txtW(`${k}/6`,[-3+k,0],{dy:24,col:K.m,font:`12px ${MONO}`});}txtW('0',[-3,0],{dy:44,col:K.f,font:`11px ${MONO}`});txtW('1',[3,0],{dy:44,col:K.f,font:`11px ${MONO}`});
        for(let k=1;k<=6;k++)dieW([-3.6+k*1.03,2.4],.75,k,{fill:done(rs)&&k>2?K.p:'#eef1f6'});},
      dragDraw(p){dotW(p,9,K.p);txtW(`P = ${fmt(p[0]+3,0)}/6`,p,{dy:-22,col:K.p,font:`600 14px ${MONO}`});}},
    {type:'explain',grid:0,q:'Volte à sua previsão sobre a caixa com 3 bolas azuis e 1 vermelha. Por que a chance de sair vermelha não é 50% nem 33%?',
      model:'Há 4 bolas, todas com a mesma chance de sair, e só 1 é vermelha: P = 1/4 = 25%. Não é 50%, porque “sair” e “não sair” não são igualmente prováveis: “não sair” tem 3 casos. E não é 33%, porque “1 para 3” é a razão entre vermelhas e azuis; a probabilidade divide os casos favoráveis pelo total de casos.',
      keys:['São 4 casos igualmente prováveis, 1 favorável: 1/4','“Acontece ou não” não quer dizer 50%','1 : 3 é razão entre as cores; a probabilidade divide pelo total']}]
});

/* ================== Parte VIII · Dois ou mais eventos ================== */
const AB8=abertura({title:'Parte VIII: o que vem aí',n:'VIII',sub:'Dois ou mais eventos',
  goals:['Montar o espaço amostral de dois dados numa <b>tabela de dupla entrada</b>','Usar a <b>árvore de probabilidades</b>: multiplicar ao longo do caminho, somar entre caminhos','Diferenciar sorteios <b>com e sem reposição</b>','Usar o complementar em problemas de “pelo menos um”'],
  lembra:[{type:'inputs',frac:true,q:'Qual é a probabilidade de sair 5 no lançamento de um dado?',fields:[PF('p','P(5) =','a probabilidade',1,6)],ok:'1 caso favorável em 6: P = 1/6 ≈ 17%.',hint:'Quantas faces o dado tem?'}],
  pred:{pid:'p8',q:'Você lança dois dados e soma os números. Qual soma é a mais provável?',opts:['Todas as somas, de 2 a 12, têm a mesma chance','A soma 7','A soma 12'],
    draw(){dieW([-1,0],1.4,3);dieW([1,0],1.4,4);txtW('3 + 4 = ?',[0,-1.9],{col:K.m,font:`14px ${MONO}`});}}});

const WAYS=[1,2,3,4,5,6,5,4,3,2,1];
const sumCol=sm=>{const t=1-Math.abs(sm-7)/5;const a=[88,196,221],b=[255,213,74];return `rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')})`;};
const DG={x0:-6.4,y0:2.2,c:.78};
const DADOS={title:'Dois dados: a tabela de 36 casas',view:[-7.4,7.2,-3.8,3.6],
  steps:['Lançando dois dados, um azul e um amarelo, cada resultado é um <b>par</b>: (1, 1), (1, 2), ..., (6, 6). Pelo princípio multiplicativo, são 6 · 6 = <b>36</b> pares, todos com a mesma chance. A tabela tem uma casa para cada par.',
    'Escreva a <b>soma</b> em cada casa. Somas iguais formam diagonais. A soma 7 aparece em <b>6</b> casas; a soma 2, só em uma (1 + 1); a soma 12, também só em uma (6 + 6). O gráfico conta as casas de cada soma.',
    {t:()=>'Por isso P(soma 7) = '+F(6,36)+' = '+F(1,6)+' ≈ 17%, enquanto P(soma 12) = '+F(1,36)+' ≈ 3%. As somas do meio são mais prováveis porque há <b>mais jeitos</b> de formá-las.'+retake('p8','A soma 7 é a mais provável: 6 dos 36 pares dão 7. As 11 somas possíveis não são igualmente prováveis, então não dá para dizer “1 em 11”.')},
    {try:1,t:'Escolha uma soma no controle para destacar as casas dela na tabela e no gráfico.'}],
  ctrlFrom:3,reset:()=>({g:0,h:0,sel:7,hl:0}),run:[async st=>{await to(st,{g:36},1800,E.lin);},async st=>{st.g=36;await to(st,{h:1},1400);},async st=>{st.g=36;st.h=1;st.hl=1;st.sel=7;},async st=>{st.g=36;st.h=1;st.hl=1;}],
  draw(st){const {x0,y0,c}=DG;for(let j=1;j<=6;j++)dieW([x0+(j-.5)*c,y0+.5],.5,j,{fill:K.y});for(let i=1;i<=6;i++)dieW([x0-.45,y0-(i-.5)*c],.5,i,{fill:K.b});
    for(let q=0;q<Math.floor(st.g);q++){const i=Math.floor(q/6)+1,j=q%6+1,sm=i+j,on=st.hl&&sm===st.sel;const x=x0+(j-1)*c,y=y0-i*c;
      rrW(x+.04,y+.04,x+c-.04,y+c-.04,{r:4,fill:st.h>0?(on?K.p:sumCol(sm)):'rgba(255,255,255,.07)',a:st.h>0&&st.hl&&!on?.35:.9});
      txtW(st.h>.5?String(sm):`${i},${j}`,[x+c/2,y+c/2],{col:K.bg,font:`${st.h>.5?700:500} ${st.h>.5?13:10}px ${MONO}`});}
    if(st.h>0){const bx=.6,by=-2.8,bw=.5,gp=.09,hs=.62;lineW([bx-.1,by],[bx+11*(bw+gp),by],K.m,{a:st.h});
      WAYS.forEach((w,k)=>{const sm=k+2,x=bx+k*(bw+gp),on=st.hl&&sm===st.sel;rectW(x,by,x+bw,by+w*hs*st.h,on?K.p:sumCol(sm),st.hl&&!on?.35:.9);txtW(String(sm),[x+bw/2,by],{dy:14,col:on?K.p:K.m,font:`12px ${MONO}`});txtW(String(w),[x+bw/2,by+w*hs*st.h],{dy:-10,col:K.w,font:`11px ${MONO}`,a:st.h});});
      txtW('casas de cada soma',[bx+3.2,by+4.4],{col:K.m,font:`12px ${MONO}`,a:st.h});
      if(st.hl){const w=WAYS[st.sel-2];txtW(`P(soma ${st.sel}) = ${w}/36 ≈ ${FR(w/36,0)}`,[bx+3.2,by+4.4],{dy:-22,col:K.p,font:`600 15px ${MONO}`});}}},
  ctrls(el){slider(el,{key:'sel',label:'Soma destacada',min:2,max:12,step:1,get:()=>ST().sel,set:v=>{ST().sel=v;},fmt:v=>fmt(v,0)});},
  info:st=>st.hl?ro([['Soma',st.sel],['Casas',WAYS[st.sel-2]],['Probabilidade',`${WAYS[st.sel-2]}/36 ≈ ${FR(WAYS[st.sel-2]/36)}`]]):''};

function branch(p,q,lab,col,a,o={}){lineW(p,q,col,{w:o.w||2.5,a});if(lab){const m=lerp2(p,q,.5);rrW(m[0]-.32,m[1]-.3,m[0]+.32,m[1]+.3,{r:6,fill:K.bg,a});if(Array.isArray(lab))fracW(lab[0],lab[1],m,{size:12,col:o.lc||K.w,a});else txtW(lab,m,{col:o.lc||K.w,font:`600 13px ${MONO}`,a});}}
const MOEDAS={title:'Duas moedas e a árvore de probabilidades',view:[-7,7.4,-4.3,4.3],
  steps:['Lançando duas moedas (C = cara, K = coroa), quantos resultados? Muita gente diria 3: duas caras, duas coroas, uma de cada. Mas “uma de cada” acontece de <b>dois jeitos</b>: cara-coroa e coroa-cara. A árvore mostra os 4 caminhos.',
    'Escreva a probabilidade em cada galho: '+F(1,2)+'. A chance de um caminho é o <b>produto</b> dos seus galhos: '+F(1,2)+' · '+F(1,2)+' = '+F(1,4)+'. Os 4 caminhos somam 1.',
    'P(uma cara e uma coroa) = '+F(1,4)+' + '+F(1,4)+' = <b>'+F(1,2)+'</b>: <b>some os caminhos</b> que levam ao evento. Regra da árvore: ao longo de um caminho, multiplique; entre caminhos diferentes, some.',
    'Com <b>3 moedas</b>, cada caminho se abre de novo: 2 · 2 · 2 = 8 caminhos de '+F(1,8)+' cada. P(três caras) = '+F(1,8)+' = 12,5%.'],
  reset:()=>({a:0,p:0,h:0,t:0}),run:[async st=>{await to(st,{a:1},1200);},async st=>{st.a=1;await to(st,{p:1},700);},async st=>{st.a=1;st.p=1;await to(st,{h:1},700);},async st=>{st.a=1;st.p=1;st.h=0;await to(st,{t:1},1000);}],
  draw(st){const R=[-6.2,0],L1=[[-3.2,2],[-3.2,-2]],F1=['C','K'];const hl=(i,j)=>st.h>0&&i!==j;
    coinW(R,.28,'',{});
    L1.forEach((p,i)=>{const a1=clamp(st.a*2,0,1);branch(R,p,st.p>0?[1,2]:null,K.m,a1);coinW(p,.32,F1[i],{a:a1});
      [[.0,1],[1,-1]].forEach(([j,dy])=>{const q=[-.2,p[1]+dy];const a2=clamp(st.a*2-1,0,1);const on=hl(i,j);branch(p,q,st.p>0?[1,2]:null,on?K.p:K.m,a2,{w:on?4:2.5});coinW(q,.32,F1[j],{a:a2});
        if(st.t>0){[[0,.5],[1,-.5]].forEach(([k,d2])=>{const r=[2.7,q[1]+d2];const on3=i===0&&j===0&&k===0;branch(q,r,null,on3?K.p:K.m,st.t,{w:on3?4:2});coinW(r,.24,F1[k],{a:st.t,fs:11});txtW(`${F1[i]}${F1[j]}${F1[k]}  1/8`,r,{dx:18,align:'left',col:on3?K.p:K.m,font:`600 12px ${MONO}`,a:st.t});});}
        else if(st.p>0)txtW(`${F1[i]}${F1[j]}:  1/2 · 1/2 = 1/4`,q,{dx:22,align:'left',col:on?K.p:K.w,font:`600 13px ${MONO}`,a:st.p});});});
    if(st.h>0)txtW('P(uma de cada) = 1/4 + 1/4 = 1/2',[2.2,-3.9],{col:K.p,font:`600 15px ${MONO}`,a:st.h});
    if(st.t>0)txtW('P(CCC) = 1/2 · 1/2 · 1/2 = 1/8',[2.2,-3.9],{col:K.p,font:`600 15px ${MONO}`,a:st.t});}};

const REPOS={title:'Com ou sem reposição',view:[-7.2,7.4,-4,4.2],
  steps:['Uma sacola tem 3 bolas azuis e 2 vermelhas. Você tira uma, anota a cor, <b>devolve</b> e tira outra. A segunda retirada encontra a sacola igual: os galhos de baixo repetem '+F(3,5)+' e '+F(2,5)+'. P(azul e azul) = '+F(3,5)+' · '+F(3,5)+' = '+F(9,25)+' = 36%.',
    'Agora <b>sem devolver</b>. Se a primeira bola foi azul, sobram 2 azuis e 2 vermelhas: a chance da segunda ser azul cai para '+F(2,4)+'. P(azul e azul) = '+F(3,5)+' · '+F(2,4)+' = '+F(6,20)+' = 30%. O primeiro sorteio mudou as chances do segundo: os eventos são <b>dependentes</b>.',
    'É assim que se calcula a chance da Mega-Sena: 6 números sorteados entre 60, <b>sem reposição</b>. Quem marca 6 números acerta os seis com chance de <b>1 em 50 063 860</b>.'],
  reset:()=>({k:0}),run:[null,async st=>{st.k=1;},async st=>{st.k=2;}],
  draw(st){if(st.k===2){for(let i=0;i<60;i++){const c=i%10,r=Math.floor(i/10);const on=[3,17,22,38,41,56].includes(i);ballW([-4.6+c*1.02,2.9-r*1.02],.4,on?K.p:'#3a4152',{label:String(i+1),lcol:on?K.bg:K.m,fs:10});}
      txtW('chance de acertar os 6: 1 em 50 063 860',[0,-3.5],{col:K.p,font:`600 15px ${MONO}`});return;}
    bag(-5.4,.3,2.6,3.2);bagBalls(-5.4,.3,[K.b,K.b,K.b,K.r,K.r],{r:.36});
    const R=[-3.4,0],A=[-.3,1.9],V=[-.3,-1.9],wo=st.k===1;
    branch(R,A,[3,5],K.b,1,{lc:K.b});branch(R,V,[2,5],K.r,1,{lc:K.r});ballW(A,.3,K.b);ballW(V,.3,K.r);
    const L=[[A,[2.6,2.9],K.b,wo?[2,4]:[3,5],'A A',wo?'3/5 · 2/4 = 6/20':'3/5 · 3/5 = 9/25'],[A,[2.6,1],K.r,wo?[2,4]:[2,5],'A V',wo?'3/5 · 2/4 = 6/20':'3/5 · 2/5 = 6/25'],
      [V,[2.6,-1],K.b,wo?[3,4]:[3,5],'V A',wo?'2/5 · 3/4 = 6/20':'2/5 · 3/5 = 6/25'],[V,[2.6,-2.9],K.r,wo?[1,4]:[2,5],'V V',wo?'2/5 · 1/4 = 2/20':'2/5 · 2/5 = 4/25']];
    L.forEach(([p,q,c,f,n,v],i)=>{branch(p,q,f,c,1,{lc:c,w:i===0?4:2.5});ballW(q,.26,c);txtW(`${n}:  ${v}`,q,{dx:20,align:'left',col:i===0?K.p:K.w,font:`600 13px ${MONO}`});});
    txtW(wo?'sem reposição':'com reposição',[0,3.8],{col:wo?K.p:K.g,font:`600 15px ${SANS}`});}};

const WE_CHUTE=WK({title:'Exemplo resolvido: chutando duas questões',view:[-7,7,-3.6,4.4],
  base(st){const c=.9,x0=-6,y0=2.6;txtW('linha: chute da 1ª questão · coluna: chute da 2ª',[x0+2*c,y0+.55],{col:K.m,font:`11px ${MONO}`});
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){const x=x0+j*c,y=y0-(i+1)*c;const ac=i===0||j===0;const fill=st.k>=3?(ac?K.g:'rgba(252,98,85,.55)'):st.k>=1&&ac?(i===0&&j===0?K.y:'rgba(131,193,103,.6)'):'rgba(255,255,255,.07)';
      rrW(x+.04,y+.04,x+c-.04,y+c-.04,{r:4,fill});txtW(`${'ABCD'[i]}${'ABCD'[j]}`,[x+c/2,y+c/2],{col:K.bg,font:`600 11px ${MONO}`,a:.8});}},
  steps:[{t:'<b>Problema.</b> Uma prova tem questões de 4 alternativas (A, B, C e D), com só uma certa. Chutando 2 questões, qual é a probabilidade de acertar <b>pelo menos uma</b>? Suponha que a certa é a A nas duas: cada casa do quadro é um par de chutes, e os 16 pares têm a mesma chance.'},
    {t:'<b>Passo 1 · compreender.</b> Cada chute acerta com '+F(1,4)+' e erra com '+F(3,4)+'. A linha A (acertou a 1ª) e a coluna A (acertou a 2ª) estão destacadas. “Pelo menos uma” inclui acertar uma ou as duas.'},
    {t:'<b>Passo 2 · planejar.</b> Contar as casas destacadas dá certo, mas há um caminho mais curto: o <b>complementar</b>. O contrário de “acertar pelo menos uma” é “errar as duas”.',draw:a=>txtW('não (pelo menos uma) = errar as duas',[2.2,2.4],{col:K.w,font:`600 13px ${MONO}`,a})},
    {t:'<b>Passo 3 · executar.</b> P(errar as duas) = '+F(3,4)+' · '+F(3,4)+' = '+F(9,16)+' (as 9 casas vermelhas). Então P(pelo menos uma) = 1 − '+F(9,16)+' = <b>'+F(7,16)+'</b> ≈ 44%.',
      draw:a=>{txtW('P(errar as duas) = 3/4 · 3/4 = 9/16',[2.2,1.2],{col:K.r,font:`600 14px ${MONO}`,a});txtW('P(pelo menos uma) = 1 − 9/16 = 7/16',[2.2,.2],{col:K.g,font:`600 15px ${MONO}`,a});}},
    {t:'<b>Confira</b> contando no quadro: a linha A tem 4 casas e a coluna A mais 3 (a casa AA já foi contada): 4 + 3 = 7 casas verdes de 16 ✓. Um chute por questão dá menos de 50% de chance de acertar alguma: chutar não é uma boa estratégia.',draw:a=>txtW('4 + 3 = 7 casas de 16  ✓',[2.2,-.9],{col:K.m,font:`600 14px ${MONO}`,a})}]});

EX.E8=exScene({title:'Pratique: dois ou mais eventos',view:[-6,6,-4,4],
  intro:'Liste o espaço amostral com tabela ou árvore. Ao longo de um caminho, multiplique; entre caminhos, some. “Pelo menos um”: use 1 − P(nenhum).',
  rounds:[
    {type:'inputs',grid:0,frac:true,view:[-7.4,7.2,-3.8,3.6],q:'<b>Complete.</b> Dois dados são lançados. Casos possíveis: __. Casos com soma 8: __. P(soma 8) = __.',
      fields:[{k:'p',label:'possíveis =',name:'os casos possíveis',ans:36},{k:'f',label:'soma 8 =',name:'os casos com soma 8',ans:5},PF('P','P =','a probabilidade',5,36)],
      ok:'36 pares. Soma 8: (2,6), (3,5), (4,4), (5,3), (6,2), 5 casos. P = 5/36 ≈ 14%.',hint:'Procure a diagonal da soma 8 na tabela.',

const RESUMO={title:'Resumo e mapa das ideias',view:[-7,7,-3.9,3.9],
  steps:[`<table class="sum"><tr><th>Ideia</th><th>Em uma linha</th></tr>
    <tr><td>Razão</td><td>Comparação por divisão: a/b. Misturas, escalas, preço por quilo.</td></tr>

    <tr><td>Filas e anagramas</td><td>Sem repetição: n · (n − 1) · ... ; n! = n · (n − 1) · ... · 1.</td></tr>
    <tr><td>Ordem não importa</td><td>Conte com ordem e divida pelas ordens de cada grupo.</td></tr>
    <tr><td>Probabilidade</td><td>P = favoráveis ÷ possíveis (casos igualmente prováveis); 0 ≤ P ≤ 1; P(não A) = 1 − P(A).</td></tr>
    <tr><td>Vários eventos</td><td>Árvore: multiplique ao longo do caminho, some entre caminhos.</td></tr>

  ctrlFrom:2,reset:()=>({sim:null}),run:[null,null,null],

    for(let p=.05;p<=.2+1e-9;p+=.05){lineW([bx-.2,by+p*hs],[bx+11*(bw+gp),by+p*hs],'rgba(88,196,221,.12)');txtW(`${fmt(100*p,0)}%`,[bx-.2,by+p*hs],{dx:-6,align:'right',col:K.m,font:`11px ${MONO}`});}
    WAYS.forEach((w,k)=>{const x=bx+k*(bw+gp);if(N){const f=c[k]/N;rectW(x,by,x+bw,by+Math.min(.26,f)*hs,K.y,.85);}
      if(st.sim){const sN=st.sim.reduce((a,b)=>a+b,0);dotW([x+bw/2,by+st.sim[k]/sN*hs],5,K.b);}

  ctrls(el){const box=document.createElement('div');box.className='exw';el.appendChild(box);

m **centímetros**: 400 000 cm = 4 000 m = 4 km. Sempre escreva a unidade em cada passo."}, {"cap": "1", "lv": 2, "tipo": "choice", "marca": "prova", "q": "Na cantina, o mesmo suco de uva é vendido em três embalagens. Qual sai mais barata por litro?", "tab": [["Embalagem", "Quantidade", "Preço"], ["caixinha", "200 mL", "R$ 2,50"], ["garrafa média", "500 mL", "R$ 5,50"], ["garrafa grande", "1 L", "R$ 9,00"]], "opts": ["a de 200 mL", "a de 500 mL", "a de 1 L", "as três têm o mesmo preço por litro"], "a": 2, "why": ["A caixinha tem o menor preço na prateleira, mas leva pouco suco: 5 caixinhas fazem 1 L e custam R$ 12,50.", "2 garrafas médias fazem 1 L e custam R$ 11,00. A grande custa R$ 9,00.", null, "Calcule o preço de 1 L em cada uma: R$ 12,50, R$ 11,00 e R$ 9,00."], "err": ["ABSOLUTO", "CONTA", null, "CONTA"], "gab": "**c.** Preço de 1 L: caixinha, 5 · 2,50 = R$ 12,50; média, 2 · 5,50 = R$ 11,00; grande, R$ 9,00. A maior é a mais cara no caixa e a mais barata por litro."}, {"cap": "2", "lv": 1, "tipo": "inputs", "q": "Na feira, 3 kg de bergamota custam R$ 12. O preço é proporcional ao peso. Complete usando a dupla reta.", "fields": [{"k": "a", "label": "1 kg: R$", "ans": 4}, {"k": "b", "label": "6 kg: R$", "ans": 24, "traps": {"15": "ADITIVA"}}, {"k": "c", "label": "9 kg: R$", "ans": 36, "traps": {"18": "ADITIVA"}}, {"k": "d", "label": "10 kg: R$", "ans": 40}], "hint": "Volte à unidade: 1 kg custa 12 ÷ 3. Ou use o fator: 6 kg é o dobro de 3 kg.", "gab": "1 kg: 12 ÷ 3 = R$ 4. 6 kg é o dobro de 3 kg: R$ 24. 9 kg é o triplo: R$ 36. 10 kg: 10 · 4 = R$ 40. Erro comum: “de 3 para 6 kg somo 3, então o preço vai a 15”."}, {"cap": "2", "lv": 2, "tipo": "choice", "q": "O Heitor tem 4 anos e a irmã dele, a Lara, tem 8: o dobro. Quando o Heitor tiver 8 anos, quantos anos a Lara terá?", "opts": ["16 anos", "12 anos", "10 anos"], "a": 1, "why": ["Idades não dobram juntas: os dois ganham 1 ano por ano. A diferença de 4 anos nunca muda.", null, "Em 4 anos, o Heitor vai de 4 para 8. A Lara também ganha 4 anos."], "err": ["LINEAR", null, "CONTA"], "gab": "**12 anos.** Cada um ganha 1 ano por ano, então a diferença (4 anos) fica sempre igual: 8 + 4 = 12. Aqui o certo é **somar**. Antes de usar a regra de três, pergunte: o que fica igual, a diferença ou a divisão?"}, {"cap": "2", "lv": 2, "tipo": "choice", "marca": "leo", "q": "Para fazer 4 cucas, a vó usa 6 ovos. O Leo quer fazer 10 cucas e pensou: “De 4 para 10 são 6 cucas a mais, então uso 6 ovos a mais: 12 ovos.” Onde ele errou?", "opts": ["Ele somou a diferença. Pela unidade: 1 cuca usa 6 ÷ 4 = 1,5 ovo, e 10 cucas usam 15 ovos.", "Ele acertou: são 12 ovos.", "Ele devia multiplicar 6 · 10 = 60 ovos."], "a": 0, "why": [null, "Teste com o dobro: 8 cucas precisam de 12 ovos (o dobro de 6). Então 10 cucas precisam de mais de 12.", "6 ovos são para 4 cucas, não para 1 cuca."], "err": [null, "ADITIVA", "CONTA"], "gab": "**a.** Somar “6 a mais” é comparar pela diferença. 1 cuca usa 6 ÷ 4 = 1,5 ovo; 10 cucas, 10 · 1,5 = **15 ovos**. Outro caminho: 2 cucas usam 3 ovos, e 10 cucas são 5 vezes 2 cucas: 5 · 3 = 15."}, {"cap": "2", "lv": 1, "tipo": "choice", "marca": "prova", "q": "O preço do morango na feira é proporcional ao peso. Qual é o preço de 2 kg?", "tab": [["Peso", "0 kg", "0,5 kg", "1 kg", "2 kg"], ["Preço", "R$ 0", "R$ 6", "R$ 12", "?"]], "opts": ["R$ 18", "R$ 24", "R$ 13", "R$ 48"], "a": 1, "why": ["De 0,5 kg para 1 kg o preço subiu R$ 6. Somar mais R$ 6 é comparar pela diferença: de 1 kg para 2 kg o peso dobra.", null, "Isso soma R$ 1 sem motivo. O peso dobrou: o preço dobra.", "Isso multiplica por 4. De 1 kg para 2 kg o peso só dobra."], "err": ["ADITIVA", null, "ADITIVA", "CONTA"], "gab": "**b.** De 1 kg para 2 kg o peso dobra, então o preço dobra: R$ 24. Confira a razão: 6 ÷ 0,5 = 12 ÷ 1 = 24 ÷ 2 = 12. E 0 kg custa R$ 0."}, {"cap": "2", "lv": 2, "tipo": "choice", "marca": "prova", "q": "Um aplicativo cobra R$ 4,00 para iniciar a corrida e mais R$ 2,50 por quilômetro. Qual é o preço da corrida de 8 km?", "tab": [["Distância", "2 km", "4 km", "8 km"], ["Preço", "R$ 9,00", "R$ 14,00", "?"]], "opts": ["R$ 28,00", "R$ 24,00", "R$ 18,00", "R$ 20,00"], "a": 1, "why": ["É a regra de três (dobrou a distância, dobra o preço). Mas os R$ 4 da partida não dobram.", null, "Isso soma R$ 4 aos R$ 14. Calcule: 4 + 2,50 · 8.", "Faltou a partida de R$ 4: só os quilômetros dão R$ 20."], "err": ["LINEAR", null, "ADITIVA", "CONTA"], "gab": "**b.** 4 + 2,50 · 8 = 4 + 20 = R$ 24. A distância dobrou (4 → 8 km), mas a partida não dobra: com 0 km já se pagam R$ 4. Por isso preço e distância não são proporcionais."}, {"cap": "3", "lv": 2, "tipo": "choice", "q": "Num dia de sol, 3 camisetas estendidas no varal secam em 2 horas. Quanto tempo levam 6 camisetas, se todas cabem no varal ao mesmo tempo?", "opts": ["4 horas", "1 hora", "2 horas"], "a": 2, "why": ["Mais camisetas não fazem cada uma secar mais devagar: elas secam todas ao mesmo tempo.", "Mais camisetas não ajudam umas às outras a secar.", null], "err": ["LINEAR", "INVERSA", null], "gab": "**2 horas.** Cada camiseta seca sozinha, ao mesmo tempo que as outras. O número de camisetas e o tempo **não são proporcionais**, nem direta nem inversamente. Antes de calcular, pergunte se uma grandeza muda mesmo a outra."}, {"cap": "3", "lv": 2, "tipo": "inputs", "q": "Pense primeiro: a relação é direta ou inversa? Depois calcule. (a) 4 amigas, no mesmo ritmo, montam um quebra-cabeça em 30 minutos. Em quanto tempo 2 delas montam o mesmo? (b) 4 pacotes de figurinhas custam R$ 30. Quanto custam 2 pacotes?", "fields": [{"k": "a", "label": "(a) tempo:", "ans": 60, "unit": "min", "traps": {"15": "LINEAR"}}, {"k": "b", "label": "(b) preço: R$", "ans": 15, "traps": {"60": "INVERSA"}}], "hint": "(a) Menos gente, mais tempo: inversa. (b) Menos pacotes, menos dinheiro: direta.", "gab": "(a) **Inversa**: metade das amigas leva o dobro do tempo, 60 min (4 · 30 = 120 = 2 · 60). (b) **Direta**: metade dos pacotes custa metade, R$ 15. Os números são iguais de propósito: o que muda é o tipo de relação."}, {"cap": "3", "lv": 1, "tipo": "inputs", "q": "Uma ração dura 30 dias para 12 cães. Para quantos dias ela dá, se forem 16 cães **desde o começo**? (É parecida de propósito com outro caso: e se os 4 cães novos chegassem só depois de 10 dias? Depois de responder, veja a comparação no gabarito.)", "fields": [{"k": "t", "label": "12 · 30 =", "ans": 360, "unit": "cão-dias"}, {"k": "d", "label": "com 16 cães, a ração dura", "ans": 22.5, "unit": "dias", "traps": {"40": "LINEAR", "34": "ADITIVA"}}], "hint": "O total de ração (em “cão-dias”) não muda: 12 · 30. Divida pelos 16 cães.", "gab": "12 · 30 = 360 “cão-dias” de ração. Com 16 cães: 360 ÷ 16 = **22,5 dias**. Mais cães, menos dias ✓. A regra de três direta daria 40 dias, o que não faz sentido. No desafio, os 12 cães já comeram 10 dias (120 cão-dias); sobram 240 para 16 cães: 15 dias, menos que 22,5, porque parte da ração já tinha acabado."}, {"cap": "3", "lv": 1, "tipo": "choice", "marca": "leo", "q": "O Leo resolveu: “A 60 km/h, uma viagem leva 4 h. A 120 km/h, o dobro da velocidade, leva o dobro do tempo: 8 h.” Onde ele errou?", "opts": ["Velocidade e tempo são inversas: dobrando a velocidade, o tempo cai pela metade, 2 h.", "Ele acertou: 8 h.", "Ele devia somar: 4 h + 60 = 64 h."], "a": 0, "why": [null, "Indo mais rápido, a viagem dura mais? Pense antes de calcular.", "Não faz sentido somar horas com km/h."], "err": [null, "LINEAR", "UNIDADE"], "gab": "**a.** Mais rápido, menos tempo. A distância é 60 · 4 = 240 km; a 120 km/h, 240 ÷ 120 = **2 h**. O Leo usou a regra de três direta sem perguntar “se aumentar isto, aquilo aumenta ou diminui?”."}, {"cap": "3", "lv": 2, "tipo": "choice", "marca": "prova", "q": "Quatro pessoas, no mesmo ritmo, fazem um trabalho em 6 horas. Alguém preencheu esta previsão. A previsão está:", "tab": [["Pessoas", "2", "4", "8"], ["Tempo", "12 h", "6 h", "3 h"]], "opts": ["certa: pessoas × horas = 24 nas três colunas", "errada: com 8 pessoas seriam 12 h", "errada: com 2 pessoas seriam 3 h", "certa: o tempo sempre diminui 6 h"], "a": 0, "why": [null, "Isso é a regra de três direta: mais gente, mais tempo?", "Com menos gente o trabalho demora mais, não menos.", "De 4 para 8 pessoas o tempo cai 3 h, não 6 h. Olhe o produto, não a diferença."], "err": [null, "LINEAR", "LINEAR", "ADITIVA"], "gab": "**a.** O trabalho é o mesmo: 4 · 6 = 24 “pessoa-horas”; 24 ÷ 2 = 12 e 24 ÷ 8 = 3. Mais gente, menos tempo, com produto constante: proporção inversa."}, {"cap": "4", "lv": 1, "tipo": "inputs", "q": "Use a barra de 10 pedaços de 10%. Um livro de R$ 50 tem 20% de desconto.", "fields": [{"k": "p", "label": "cada pedaço (10%): R$", "ans": 5}, {"k": "n", "label": "pedaços que sobram:", "ans": 8, "traps": {"2": "PARTE"}}, {"k": "v", "label": "preço com desconto: R$", "ans": 40, "traps": {"10": "PARTE", "30": "UNIDADE"}}], "hint": "10% de 50 é 50 ÷ 10. Desconto de 20% risca 2 pedaços: quantos sobram?", "gab": "Cada pedaço: 50 ÷ 10 = R$ 5. O desconto de 20% risca 2 pedaços; sobram 8. Preço: 8 · 5 = **R$ 40**. Com o fator: 50 · 0,8 = 40."}, {"cap": "4", "lv": 2, "tipo": "choice", "q": "A passagem de ônibus subiu de R$ 5,00 para R$ 6,00. O aumento foi de quantos por cento?", "opts": ["1%", "16,7%", "20%", "6%"], "a": 2, "why": ["R$ 1 é o aumento em reais, não em porcentagem.", "Você dividiu pelo preço novo (1 ÷ 6). A porcentagem é sobre o preço antigo.", null, "6 é o preço novo em reais."], "err": ["UNIDADE", "PCT_BASE", null, "UNIDADE"], "gab": "**20%.** O aumento foi de R$ 1 sobre o preço antigo, R$ 5: 1 ÷ 5 = 0,2 = 20%. Na barra: R$ 5 são 10 pedaços de R$ 0,50; R$ 1 são 2 pedaços, 20%."}, {"cap": "4", "lv": 3, "tipo": "inputs", "q": "Na liquidação, a Ana comprou um casaco com 20% de desconto e pagou R$ 120. Quanto o casaco custava antes? Use a barra de 10 pedaços de 10%.", "fields": [{"k": "v", "label": "preço antes: R$", "ans": 150, "traps": {"144": "PCT_BASE", "140": "PCT_BASE", "96": "PCT_BASE"}}], "hint": "Com 20% de desconto, ela pagou 80% do preço: R$ 120 são 8 pedaços. Quanto vale 1 pedaço?", "gab": "Ela pagou 80% do preço: R$ 120 são 8 pedaços de 10%. Cada pedaço vale 120 ÷ 8 = R$ 15; os 10 pedaços valem **R$ 150**. Confira: 20% de 150 = 30, e 150 − 30 = 120 ✓. Erro comum: 120 + 20% de 120 = 144, porcentagem sobre o valor errado."}, {"cap": "4", "lv": 2, "tipo": "choice", "marca": "leo", "q": "O Leo disse: “O tênis de R$ 200 teve 30% de desconto. 30% de 200 = 60. Então paguei R$ 60.” Onde ele errou?", "opts": ["R$ 60 é o desconto. Ele paga 200 − 60 = R$ 140.", "30% de 200 é 30, e não 60.", "Ele paga 200 + 60 = R$ 260."], "a": 0, "why": [null, "10% de 200 é 20; 30% é 3 · 20 = 60. Essa conta o Leo acertou.", "Desconto diminui o preço."], "err": [null, "CONTA", "CONTA"], "gab": "**a.** 30% de 200 = 60 é o **desconto**. O preço final é 200 − 60 = **R$ 140**, ou seja, 70% do preço (200 · 0,7 = 140)."}, {"cap": "4", "lv": 2, "tipo": "choice", "marca": "prova", "q": "Uma conta de luz era de R$ 200. Subiu 10% em janeiro e mais 10% em fevereiro. Quanto ficou?", "opts": ["R$ 240", "R$ 242", "R$ 220", "R$ 210"], "a": 1, "why": ["Isso é 20% de 200. Mas o segundo 10% é sobre o preço que já subiu.", null, "Isso é só o aumento de janeiro.", "10% de 200 é 20, e não 10."], "err": ["PCT_SOMA", null, "CONTA", "CONTA"], "gab": "**b.** Janeiro: 200 + 20 = R$ 220. Fevereiro: 10% de 220 = 22, então R$ 242. Com fatores: 200 · 1,1 · 1,1 = 242. Dois aumentos de 10% dão 21%, não 20%."}, {"cap": "5", "lv": 1, "tipo": "inputs", "q": "Na cantina há 3 salgados (pastel, coxinha, enroladinho) e 2 sucos (uva, laranja). Um lanche tem 1 salgado e 1 suco. Desenhe o quadro: salgados nas linhas, sucos nas colunas. Quantos lanches diferentes?", "fields": [{"k": "n", "label": "lanches:", "ans": 6, "traps": {"5": "SOMA_MULT"}}], "hint": "O quadro tem 3 linhas e 2 colunas. Conte as casas.", "gab": "O quadro tem 3 linhas e 2 colunas: **6** casas, 6 lanches (3 · 2). Somar 3 + 2 = 5 conta os itens do cardápio, não os lanches."}, {"cap": "5", "lv": 2, "tipo": "inputs", "q": "Um combo tem 1 bebida (chocolate quente ou chá) **e** 1 comida, que pode ser um salgado (3 opções) **ou** um doce (4 opções). Quantos combos diferentes existem?", "fields": [{"k": "c", "label": "comidas possíveis:", "ans": 7, "traps": {"12": "SOMA_MULT"}}, {"k": "n", "label": "combos:", "ans": 14, "traps": {"24": "SOMA_MULT", "9": "SOMA_MULT"}}], "hint": "Primeiro a comida: salgado OU doce (some). Depois bebida E comida (multiplique).", "gab": "Comida: salgado **ou** doce, 3 + 4 = 7 opções. Combo: bebida **e** comida, 2 · 7 = **14**. Erros comuns: 2 · 3 · 4 = 24 (multiplicar tudo) e 2 + 3 + 4 = 9 (somar tudo)."}, {"cap": "5", "lv": 2, "tipo": "inputs", "q": "Com os algarismos 1, 2 e 3, quantos números de 2 algarismos **diferentes** dá para formar? Liste todos.", "fields": [{"k": "n", "label": "números:", "ans": 6, "traps": {"9": "REPOS", "3": "ORDEM"}}], "hint": "Dezena: 3 opções. Unidade: qualquer um menos o que já foi usado.", "gab": "Dezena: 3 opções; unidade: sobram 2. Total: 3 · 2 = **6**: 12, 13, 21, 23, 31, 32. Se pudesse repetir, seriam 3 · 3 = 9 (com 11, 22 e 33)."}, {"cap": "5", "lv": 1, "tipo": "choice", "marca": "leo", "q": "O Leo contou as senhas de 3 dígitos (0 a 9, podendo repetir) assim: “10 + 10 + 10 = 30 senhas.” Onde ele errou?", "opts": ["As casas vêm uma depois da outra: multiplica. 10 · 10 · 10 = 1000.", "Ele acertou: são 30 senhas.", "O certo é 9 · 9 · 9 = 729, porque não pode repetir."], "a": 0, "why": [null, "Só as senhas que começam com 0 já são 100 (de 000 a 099).", "O enunciado diz que pode repetir."], "err": [null, "SOMA_MULT", "CONTA"], "gab": "**a.** Para cada um dos 10 primeiros dígitos há 10 segundos, e para cada par há 10 terceiros: 10 · 10 · 10 = **1000** senhas (de 000 a 999). Somar conta os algarismos, não as senhas."}, {"cap": "5", "lv": 1, "tipo": "choice", "marca": "prova", "q": "No refeitório, cada bandeja leva 1 prato principal, 1 salada e 1 suco. Há 3 pratos, 2 saladas e 4 sucos. Quantas bandejas diferentes dá para montar?", "opts": ["3 + 2 + 4 = 9", "3 · 2 · 4 = 24", "3 · 2 = 6", "4 · 4 · 4 = 64"], "a": 1, "why": ["9 conta os itens do cardápio, e não as bandejas.", null, "Faltou o suco.", "Cada etapa tem seu próprio número de opções."], "err": ["SOMA_MULT", null, "CONTA", "CONTA"], "gab": "**b.** São etapas (“e”): prato **e** salada **e** suco. Multiplique: 3 · 2 · 4 = **24**. Na árvore: 3 galhos, cada um abre em 2, cada um desses em 4: 24 pontas."}, {"cap": "6", "lv": 1, "tipo": "inputs", "q": "De quantos jeitos dá para arrumar 3 livros diferentes numa prateleira, um ao lado do outro? Liste com as letras A, B e C.", "fields": [{"k": "n", "label": "jeitos:", "ans": 6, "traps": {"3": "ORDEM", "9": "CONTA"}}], "hint": "1º lugar: 3 opções. 2º: sobram 2. 3º: sobra 1.", "gab": "3 · 2 · 1 = 3! = **6**: ABC, ACB, BAC, BCA, CAB, CBA. Aqui a ordem importa: ABC e CBA são arrumações diferentes."}, {"cap": "6", "lv": 2, "tipo": "inputs", "q": "Quatro amigas: Ana, Bia, Cris e Duda. (a) No ônibus da excursão sobrou um banco de 2 lugares: janela e corredor. De quantos jeitos 2 delas podem se sentar ali? (b) De quantos jeitos dá para escolher 2 delas para ganhar ingressos de cinema?", "fields": [{"k": "a", "label": "(a) banco:", "ans": 12, "traps": {"6": "ORDEM", "16": "CONTA"}}, {"k": "b", "label": "(b) ingressos:", "ans": 6, "traps": {"12": "ORDEM"}}], "hint": "(a) Janela e corredor são lugares diferentes: a ordem importa. (b) Ganhar ingressos: Ana e Bia é o mesmo que Bia e Ana.", "gab": "(a) A ordem importa (janela ≠ corredor): 4 · 3 = **12**. (b) Não importa: cada dupla apareceu 2 vezes em (a), 12 ÷ 2 = **6**: AB, AC, AD, BC, BD, CD."}, {"cap": "6", "lv": 3, "tipo": "inputs", "q": "Um carro de aplicativo só pode levar 3 das 4 amigas (Ana, Bia, Cris e Duda); qualquer uma pode ficar para a próxima viagem, e o lugar de cada uma no carro não importa. Quantos grupos diferentes de 3 podem ir? Dica: pense em quem fica de fora.", "fields": [{"k": "n", "label": "grupos:", "ans": 4, "traps": {"24": "ORDEM", "12": "ORDEM"}}], "hint": "Escolher 3 que vão é o mesmo que escolher 1 que fica.", "gab": "Escolher 3 que vão é escolher **1 que fica**: 4 jeitos. Pela conta: 4 · 3 · 2 = 24 filas, e cada trio aparece em 3! = 6 ordens: 24 ÷ 6 = **4**."}, {"cap": "6", "lv": 2, "tipo": "choice", "marca": "leo", "q": "O Leo contou os jogos de um torneio com 6 times, em que cada time joga uma vez contra cada um dos outros: “6 · 5 = 30 jogos.” Onde ele errou?", "opts": ["Cada jogo foi contado duas vezes (A contra B e B contra A): 30 ÷ 2 = 15 jogos.", "O certo é 6 · 6 = 36.", "O certo é 6 + 5 = 11."], "a": 0, "why": [null, "6 · 6 inclui cada time jogando contra si mesmo.", "Cada time joga 5 vezes; não dá para somar."], "err": [null, "CONTA", "SOMA_MULT"], "gab": "**a.** Na conta 6 · 5, o jogo A × B entra na vez do A e de novo na vez do B. A ordem não importa: 30 ÷ 2 = **15** jogos."}, {"cap": "6", "lv": 2, "tipo": "choice", "marca": "prova", "q": "A turma vai escolher 2 representantes, com a mesma função, entre Ana, Bruno, Caio e Duda. Quantas duplas diferentes existem?", "opts": ["4 · 3 = 12", "4 · 3 ÷ 2 = 6", "4 · 4 = 16", "4 + 3 = 7"], "a": 1, "why": ["12 conta cada dupla duas vezes (Ana e Bruno, Bruno e Ana).", null, "16 coloca cada aluno em dupla com ele mesmo.", "Escolher 2 pessoas não é somar."], "err": ["ORDEM", null, "CONTA", "SOMA_MULT"], "gab": "**b.** Trocar a ordem não muda a dupla: 4 · 3 = 12 conta cada uma duas vezes, então 12 ÷ 2 = **6**: AB, AC, AD, BC, BD, CD. Se fossem presidente e vice, a ordem importaria e seriam 12."}, {"cap": "7", "lv": 1, "tipo": "inputs", "q": "Uma roleta está dividida em 8 partes iguais: 5 vermelhas, 2 azuis e 1 verde. Qual é a probabilidade de parar no vermelho?", "fields": [{"k": "p", "label": "P(vermelho) =", "traps": {"0.3333333333333333": "EQUIPROB"}, "ans": 0.625, "frac": [5, 8], "tol": 0.0055}], "hint": "São 8 partes iguais. Quantas são vermelhas?", "gab": "8 partes iguais, 5 vermelhas: P = **5/8** = 62,5%, mais que 1/2 (4/8). Não é 1/3: são 3 cores, mas as cores não têm o mesmo tamanho. E não é 5/3 (vermelho ÷ outras cores): uma probabilidade nunca passa de 1, porque se divide pelo **total**."}, {"cap": "7", "lv": 2, "tipo": "choice", "q": "Você quer uma bala de morango e vai pegar uma, sem olhar, de um dos saquinhos. Saquinho A: 3 de morango e 1 de limão. Saquinho B: 6 de morango e 6 de limão. De qual é melhor pegar?", "opts": ["Do saquinho A", "Do saquinho B", "Tanto faz"], "a": 0, "why": [null, "B tem mais balas de morango, mas também mais de limão. Compare a fração: 3/4 contra 6/12.", "Calcule as duas chances: 3/4 = 75% e 6/12 = 50%."], "err": [null, "ABSOLUTO", "CONTA"], "gab": "**A.** P(morango) = 3/4 = 75% em A, contra 6/12 = 50% em B. “Mais balas de morango” não é o mesmo que “mais chance”: divida pelo total, como nos sucos."}, {"cap": "7", "lv": 1, "tipo": "choice", "marca": "leo", "q": "O Leo resolveu: “Numa caixa há 2 bolas verdes e 8 amarelas. A chance de sair verde é 2/8.” Onde ele errou?", "opts": ["Ele dividiu pelas amarelas. O total é 10 bolas: P = 2/10 = 1/5.", "Ele acertou: 2/8.", "O certo é 1/2: ou sai verde ou não sai."], "a": 0, "why": [null, "2/8 compara verdes com amarelas (parte com parte). A probabilidade divide pelo total.", "“Sair” e “não sair” não têm a mesma chance: “não sair” tem 8 bolas."], "err": [null, "PARTE", "EQUIPROB"], "gab": "**a.** 2 : 8 é a razão entre as cores. A probabilidade divide pelo **total**: 2 + 8 = 10 bolas, P = 2/10 = **1/5** = 20%."}, {"cap": "7", "lv": 1, "tipo": "choice", "marca": "prova", "q": "Na cantina, 40 alunos votaram no suco da sexta. Um nome será sorteado. A probabilidade de sair um aluno que votou em laranja é:", "tab": [["Sabor", "Alunos"], ["Uva", "10"], ["Laranja", "16"], ["Limão", "8"], ["Manga", "6"], ["Total", "40"]], "opts": ["16%", "1/4", "2/5", "1/2"], "a": 2, "why": ["16 é o número de alunos, não a porcentagem. Divida por 40.", "1/4 = 10/40 é a chance de uva.", /* ================== questões novas (fonte única: questoes.py) ==================
   NOVAS, ERROS e FRASES são injetados pelo build a partir de questoes.py, o mesmo arquivo
   que gera as questões da apostila em PDF. Cada capítulo ganha uma cena "Mais prática";
   as da revisão e da avaliação entram no fim das cenas que já existem. */
const _md=s=>String(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const _tab=t=>t?`<table class="qtab"><tr>${t[0].map(c=>`<th>${c}</th>`).join('')}</tr>${t.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`:'';
const _tag=q=>q.marca==='leo'?'<b>Onde o Leo errou?</b> ':q.marca==='prova'?'<b>Estilo prova.</b> ':'';
function novaRodada(q){
  const base={grid:0,lv:q.lv,q:_tag(q)+_md(q.q)+_tab(q.tab),ok:_md(q.gab),src:'novas'};
  if(q.tipo==='choice')return Object.assign(base,{type:'choice',opts:q.opts.map(_md),a:q.a,why:q.why.map(w=>w&&_md(w)),err:q.err});
  const fr=q.fields.some(f=>f.frac);
  return Object.assign(base,{type:'inputs',frac:fr,hint:_md(q.hint||''),fbExtra:fr?rs=>q.fields.some(f=>f.frac&&_valor(rs.vals[f.k])>1)?'Uma probabilidade <b>nunca passa de 1</b> (100%): divida pelo <b>total</b>, e não pela outra parte.':null:null,
    fields:q.fields.map(f=>({k:f.k,label:f.label,name:f.label.replace(/[:=]\s*(R\$)?\s*$/,'').trim(),ans:f.ans,unit:f.unit,tol:f.tol??0.011,
      show:f.frac?`${f.frac[0]}/${f.frac[1]}`:undefined,frac:!!f.frac,traps:f.traps||null}))});
}
/* valor digitado: aceita 3/8, 0,375 e 37,5% */
function _valor(raw){let pc=false;if(typeof raw==='string'&&/%\s*$/.test(raw)){raw=raw.replace(/%\s*$/,'');pc=true;}const v=parseNum(raw);return pc?v/100:v;}
const TEMAS={1:'razão',2:'proporção direta',3:'proporção inversa',4:'porcentagem',5:'princípio multiplicativo',6:'a ordem importa?',7:'probabilidade',8:'dois ou mais eventos',9:'probabilidade e frequência'};
for(let c=1;c<=9;c++){
  const qs=NOVAS.filter(q=>q.cap===String(c));
  EX['N'+c]=exScene({title:'Mais prática: '+TEMAS[c],view:[-6,6,-4,4],
    intro:`<b>Opcional.</b> Mais questões desta parte, para quando quiser treinar mais ou antes de uma prova: uma situação nova, um erro do Leo para descobrir e questões no estilo da prova da escola. Não precisa fazer todas.<span class="note"><span class="tag">Em uma frase</span>${_md(FRASES[c])}</span>`,
    rounds:qs.map(novaRodada)});
}
/* revisão e avaliação: rodadas a mais no fim das cenas existentes (o progresso salvo continua valendo) */
[[EX.R0,'R'],[EX.Z,'A']].forEach(([sc,cap])=>{NOVAS.filter(q=>q.cap===cap).map(novaRodada).forEach(r=>{sc.R.push(r);sc.E.rs.push({p:null,vals:{},dist:3,dir:null});});});

const LS='proporcao-contagem-probabilidade-v1';const REPORT={name:''};
function saveProgress(){try{const d={name:REPORT.name,ex:{}};SC.forEach(sc=>{if(sc.E)d.ex[sc.title]=sc.E.rs.map(r=>({ok:!!r.ok,shown:!!r.shown,first:!!r.first,grade:r.grade??null,text:(r.vals&&r.vals.text)||'',tries:r.tries||0,sel:r.vals?(r.vals.sel??null):null}));});d.lab=LAB;localStorage.setItem(LS,JSON.stringify(d));}catch(e){}}
function loadProgress(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(!d)return;REPORT.name=d.name||'';if(d.lab&&Array.isArray(d.lab.c)){d.lab.c.slice(0,11).forEach((v,i)=>{LAB.c[i]=String(v??'');});}
  SC.forEach(sc=>{const v=d.ex&&d.ex[sc.title];if(!sc.E||!v)return;v.forEach((s,i)=>{const rs=sc.E.rs[i],r=sc.R[i];if(!rs||!r)return;
    Object.assign(rs,{ok:s.ok,shown:s.shown,first:s.first,grade:s.grade,tries:s.tries});if(s.text)rs.vals.text=s.text;if(s.sel!=null)rs.vals.sel=s.sel;if(s.ok||s.shown){fillAnswer(r,rs);if(r.type==='explain')rs.revealed=true;}});});}catch(e){}}
function exList(){return SC.map((sc,i)=>({sc,i})).filter(o=>o.sc.E);}
function reportText(){
  const d=new Date();const L=[`Proporção, Contagem e Probabilidade · relatório de ${REPORT.name||'(sem nome)'}`,`Data: ${d.toLocaleDateString('pt-BR')}`,''];
  L.push('EXERCÍCIOS');
  exList().forEach(({sc,i})=>{if(sc.exam)return;const n=sc.R.length,ok=sc.E.rs.filter(r=>r.ok).length,sh=sc.E.rs.filter(r=>r.shown).length;L.push(`- Cena ${i+1}. ${sc.title}: ${ok} de ${n}${sh?` (viu a resposta em ${sh})`:''}`);});
  const ex=SC.find(s=>s.exam);if(ex){L.push('','AVALIAÇÃO FINAL',`- ${ex.E.rs.filter(r=>r.first).length} de ${ex.R.length} na primeira tentativa (${ex.E.rs.filter(r=>r.ok).length} resolvidas no total)`);}

  if(i<0){i=nearest(px,py);jump=i>=0;}if(i<0)return;
  dragIdx=i;selIdx=i;try{cv.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();if(jump)moveHandle(i,px,py);dirty=true;});
cv.addEventListener('pointermove',e=>{const [px,py]=pxy(e);
  if(dragIdx<0){cv.style.cursor=hit(px,py,false)>=0?'grab':(nearest(px,py)>=0?'crosshair':'default');return;}
  moveHandle(dragIdx,px,py);cv.style.cursor='grabbing';});

function render(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=K.bg;ctx.fillRect(0,0,W,H);setCam();
  const sc=SC[cur.si],st=sc.st;if(!st)return;
  if(sc.tick){const dt=Math.min(.05,Math.max(0,(now-(st._t||now))/1000));st._t=now;sc.tick(st,dt);}
  sc.draw(st);
  if(st.drag&&sc.handles){sc.handles(st).forEach((h,i)=>{const [x,y]=S(h.p);const pulse=RM?0:(Math.sin(now/320)+1)/2;
    ctx.save();ctx.strokeStyle=h.col;ctx.globalAlpha=.35+.35*pulse;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,14+5*pulse,0,7);ctx.stroke();ctx.restore();
    ctx.save();ctx.fillStyle=K.bg;ctx.strokeStyle=h.col;ctx.lineWidth=(i===selIdx&&document.activeElement===cv)?4:3;ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fill();ctx.stroke();ctx.restore();});}
  const touch=st.drag?'none':'pan-y';if(touch!==lastTouch){cv.style.touchAction=touch;lastTouch=touch;}
  const inf=sc.info?sc.info(st):'';if(inf!==lastInfo){const el=$('info');if(el)el.innerHTML=inf;lastInfo=inf;}
  syncs.forEach(f=>f());
}
function loop(now){

  const had=tweens.length>0;stepTweens(now);
  const st=cur.si>=0?ST():null;

}
